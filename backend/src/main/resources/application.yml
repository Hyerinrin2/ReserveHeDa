spring:
  application:
    name: reserveheda

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:reserveheda}
    username: ${POSTGRE_USERNAME}
    password: ${POSTGRE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${POSTGRE_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000      # 30분 (ms)
  refresh-expiration: 604800000   # 7일 (ms)
